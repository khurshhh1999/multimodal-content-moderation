name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/moderation_shared/pyproject.toml

      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check apps packages tests scripts eval

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Dashboard typecheck / build
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/moderation_shared/pyproject.toml
            apps/api/requirements.txt
            apps/worker/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt

      - name: Pytest
        run: pytest -q

  eval-smoke:
    name: Eval smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/moderation_shared/pyproject.toml
            apps/worker/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
          pip install -r apps/worker/requirements.txt

      - name: Build labeled set + smoke harness
        env:
          PYTHONPATH: apps/worker:packages/moderation_shared/src
        run: |
          python scripts/generate_samples.py
          python scripts/build_labeled_set.py
          python eval/harness.py --min-n 50
